function points(seed=1,n=65){let a=[],v=12;for(let i=0;i<n;i++){v+=1.1+Math.sin(i*1.7+seed)*3+Math.cos(i*.46+seed)*1.8;a.push(v)}return a}
function chart(seed=1,mini=false,drawdown=false){let a=points(seed),w=mini?290:720,h=mini?70:235,left=mini?0:45,right=mini?0:48,top=mini?4:20,bottom=mini?4:30;let min=Math.min(...a)-8,max=Math.max(...a)+10;let p=a.map((v,i)=>[left+i*(w-left-right)/(a.length-1),top+(1-(v-min)/(max-min))*(h-top-bottom)]);let d=p.map((v,i)=>(i?'L':'M')+v.map(x=>x.toFixed(1)).join(',')).join(' ');let grid=mini?'':[0,1,2,3].map(i=>{let y=top+i*(h-top-bottom)/3;return `<line class="grid" x1="${left}" x2="${w-right}" y1="${y}" y2="${y}"/><text x="${w-right+12}" y="${y+4}">${drawdown?'-'+(i*2)+'%':(30-i*10)+'%'}</text>`}).join('');let labels=mini?'':['Июль','Август','Сентябрь','Октябрь'].map((v,i)=>`<text x="${left+i*(w-left-right)/3}" y="${h-6}" text-anchor="${i===3?'end':'start'}">${v}</text>`).join('');return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Демонстрационная ${drawdown?'просадка':'кривая доходности'}"><defs><linearGradient id="g${seed}${mini}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6681e7" stop-opacity=".17"/><stop offset="1" stop-color="#6681e7" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${d} L${w-right},${h-bottom} L${left},${h-bottom} Z" fill="url(#g${seed}${mini})"/>${mini?'':`<path class="benchmark" d="M${left},${h-bottom-10} Q${w*.3},${h*.8} ${w*.5},${h*.65} T${w-right},${h*.52}"/>`}<path class="line" d="${d}"/>${mini?'':`<circle cx="${p.at(-1)[0]}" cy="${p.at(-1)[1]}" r="4" fill="#4869e8" stroke="white" stroke-width="2"/>`}${labels}</svg>`}
function spark(seed){return `<div class="spark">${chart(seed,true)}</div>`}function card(label,value,detail,seed=0){return `<div class="card"><div class="card-label">${label}${icon('arrow')}</div><div class="value">${value}</div><div class="delta">${detail}</div>${seed?spark(seed):''}</div>`}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOverlay();if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();search()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.strategy-card')){e.preventDefault();detail(e.target.dataset.strategy)}if(e.key==='Tab'&&document.querySelector('.overlay')){let list=[...document.querySelectorAll('.overlay button,.overlay input,.overlay select,.overlay a')].filter(x=>!x.hidden&&!x.disabled);let first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('hashchange',()=>{let p=location.hash.slice(1);if([...navs,...ops].some(x=>x[0]===p)&&p!==state.page){state.page=p;render()}});
try{let saved=JSON.parse(localStorage.getItem('atlas-demo-weights'));if(Array.isArray(saved)&&saved.length===5&&saved.every(v=>Number.isFinite(v)&&v>=0&&v<=100))state.weights=saved}catch{}
