[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mishadev-backtester"
version = "0.4.0"
description = "Historical tick backtesting for Python signal and order strategies"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.2,<2",
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "plotly>=6,<7",
    "pyarrow>=19,<25",
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
backtester = "backtester.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
